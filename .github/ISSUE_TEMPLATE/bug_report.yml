name: 不具合の報告 / Bug report
description: OverRec が思ったとおりに動かないとき / When OverRec doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先に [FAQ](https://misyaguziya.github.io/OverRec-Docs/faq) で同じ症状がないか確認してください。
        ここは公開の場所です。ユーザー名やメールアドレスなど、個人の情報は書かないでください。

        Please check the [FAQ](https://misyaguziya.github.io/OverRec-Docs/en/faq) first. English is fine.
        This is a public place. Don't include personal information such as your user name or email address.
  - type: input
    id: version
    attributes:
      label: OverRec のバージョン / OverRec version
      description: PC の設定画面の左下 / Bottom left of the PC settings window
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 使っている VR 機器とつなぎ方 / VR headset and how it is connected
      placeholder: 例 / e.g. Valve Index, Quest 3 (Virtual Desktop)
    validations:
      required: true
  - type: input
    id: obs
    attributes:
      label: OBS Studio のバージョン / OBS Studio version
      placeholder: 例 / e.g. 31.0.2
  - type: textarea
    id: steps
    attributes:
      label: 行った操作 / Steps
      description: 起きるまでの操作を順に / What you did, in order
      placeholder: |
        1. 手首のパネルを出す
        2. 「リプレイ保存」を押す
        3. ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 起きたことと、期待していたこと / What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: ログ（任意） / Log (optional)
      description: |
        設定画面の「困ったとき」→「ログ」の「コピー」で写したものを貼ってください。ユーザー名の部分は消してください。
        Paste what "Troubleshooting" → "Log" → "Copy" copies. Remove your user name from it.
      render: text
