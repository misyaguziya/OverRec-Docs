name: Bug report
description: When OverRec doesn't work as expected (English)
labels: [bug, "lang:en", needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [FAQ](https://misyaguziya.github.io/OverRec-Docs/en/faq) first.

        **This is a public place.** Don't include your Windows user name, your Steam or VRChat name, folder paths that contain your user name,
        your email address, or your BOOTH order number. If they appear in a log or screenshot, remove them before attaching it.
        Don't post a security vulnerability here. [Report it privately](https://github.com/misyaguziya/OverRec-Docs/security/advisories/new) instead.

        Supported: Windows 10 / 11, VR through SteamVR only, OBS Studio 28 or later.
  - type: input
    id: version
    attributes:
      label: OverRec version
      description: Bottom left of the PC settings window
      placeholder: v1.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11
        - Windows 10
        - Other (not supported)
    validations:
      required: true
  - type: input
    id: steamvr
    attributes:
      label: SteamVR version
      description: If you know it
  - type: input
    id: device
    attributes:
      label: VR headset and how it is connected
      description: Headset and controllers, and how they connect to your PC
      placeholder: e.g. Valve Index, Quest 3 (Virtual Desktop)
    validations:
      required: true
  - type: input
    id: obs
    attributes:
      label: OBS Studio version
      placeholder: e.g. 31.0.2
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, in order
      placeholder: |
        1. Bring up the wrist panel
        2. Press "Save replay"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often it happens
      options:
        - Every time
        - Sometimes
        - Only once
        - I don't know
  - type: textarea
    id: attachments
    attributes:
      label: Logs and screenshots (optional)
      description: |
        Don't paste a long log here. Drag the file into this box to attach it.
        The log is `error.log` in the folder that "Troubleshooting" → "Settings folder" → "Open folder" opens.
        Before attaching, check that it contains no user name or path.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information, such as my Windows user name, my Steam or VRChat name, full paths and my BOOTH order number, from the text and the attachments.
          required: true
